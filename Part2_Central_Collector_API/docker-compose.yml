services:
  collector:
    build:
      context: ..               # repo root, so the Dockerfile can COPY common/
      dockerfile: Part2_Central_Collector_API/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Shared database — all parts must point at the same file.
      # This path is inside the named volume mounted below.
      HONEYPOT_DB_PATH: /app/data/honeypot_aggregator.db
      NODE_KEYS_JSON: '{"node-01":"dev-node-01-key","node-02":"dev-node-02-key","node-03":"dev-node-03-key"}'
      MAX_BATCH_SIZE: "20"
      MAINTENANCE_INTERVAL_SECONDS: "60"
    volumes:
      # Named volume shared with the enricher, the alert engine and the
      # dashboard. Every part that runs in Docker must mount this same volume.
      - tiadh_db:/app/data

volumes:
  tiadh_db:
    external: true   # Create once with: docker volume create tiadh_db
