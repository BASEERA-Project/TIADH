[project]
name = "dashboard"
version = "0.2.0"
description = "Flask dashboard for the distributed honeypot threat intelligence aggregator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "common",
    "flask>=3.1.0",
]

[project.optional-dependencies]
# Flask's own server is fine for a demo; waitress is the one to use on Windows
# for anything left running.
serve = ["waitress>=3.0.0"]

[tool.uv.sources]
common = { path = "../common", editable = true }
