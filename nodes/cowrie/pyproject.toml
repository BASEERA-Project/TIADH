[project]
name = "cowrie-node"
version = "0.1.0"
description = "Honeypot sensor: ships Cowrie's events to the aggregator's collector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # adapter.py POSTs batches to the collector over HTTPS.
    "requests>=2.31",
    # adapter.py reads this node's settings from nodes/cowrie/.env. The
    # aggregator gets the same behaviour from common/config.py, which a sensor
    # host does not have.
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# stub_server.py stands in for the collector when testing a sensor on its own.
# An extra rather than a dependency group, so that the thing a sensor host
# actually does — `uv run adapter.py` — needs no flag and never installs Flask.
# Only the stub opts in, with `uv run --extra stub stub_server.py`.
stub = ["flask>=3.1"]
