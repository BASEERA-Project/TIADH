# Turns on the JSON log adapter.py reads. Mounted into the container over
# /opt/dionaea/etc/dionaea/ihandlers-enabled/, which is how dionaea enables an
# ihandler: a file in `ihandlers-enabled` rather than a setting anywhere.
# Neither of dionaea's JSON handlers is on by default. The image ships
# log_sqlite, and nothing that writes JSON.
#
# KEEP THIS FILE PURE ASCII, comments included. dionaea decodes its config as
# ASCII, so one non-ASCII byte anywhere in it - an em dash in a comment will do
# - raises UnicodeDecodeError, the whole file fails to parse, and the handler
# is never configured. The honeypot then runs perfectly normally and writes no
# JSON at all. What you get in var/log/dionaea/dionaea.log is one line:
#
#   python ...module.c:1039-warning: UnicodeDecodeError at
#   UnicodeDecodeError('ascii', b"# Turns on the JSON log ...", 281, 282, ...)
#
# which quotes this file back at you with the offending offset.
#
# The URL below is absolute, with three slashes, and that is not a detail
# either. dionaea's own shipped template says
# `file://var/lib/dionaea/dionaea.json`, which urlparse reads as host 'var' and
# path '/lib/dionaea/dionaea.json'. Opening that fails, the loader catches it,
# and you get the same outcome by a different route - a running honeypot
# writing no JSON - reported as:
#
#   log_incident ...-critical: Unable to open file /lib/dionaea/dionaea.json
#                              Error message 'No such file or directory'
#
# log_incident writes one line per incident: every connection accepted, every
# credential offered, every command, every file captured, and every close. It
# is the richer of dionaea's two JSON logs. See this node's README for the
# comparison, and for how to use log_json instead.
- name: log_incident
  config:
    handlers:
      - file:///opt/dionaea/var/log/dionaea/dionaea_incident.json
