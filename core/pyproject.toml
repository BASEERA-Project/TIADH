[project]
name = "core"
version = "0.1.0"
description = "Operational layer: the storage/alerting/export CLI, the enricher and the collector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "common",
    # enricher/enrich.py geolocates attacker IPs over HTTP (ip-api.com).
    "requests>=2.31",
    # collector/ — the FastAPI service the honeypot nodes ship events to.
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[tool.uv.sources]
common = { path = "../common", editable = true }

[tool.pytest.ini_options]
# The collector is imported as `app.*` from inside collector/, so that
# directory goes on the path and `uv run pytest` works from core/.
testpaths = ["collector/tests"]
pythonpath = ["collector"]
